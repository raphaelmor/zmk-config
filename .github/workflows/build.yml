name: Build ZMK firmware

# Branches and PRs only. Tags are handled by release.yml, which builds the same way
# and additionally attaches the .uf2 files to the release — without this filter a
# version tag would build everything twice.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
