# TOTEM validation build.
#
# USB serial logging is NOT enabled here. In ZMK v0.3 it must come from the
# "zmk-usb-logging" snippet, which build.yaml applies to both halves. Setting
# CONFIG_ZMK_USB_LOGGING=y in this file cannot work: the symbol selects
# USB_CDC_ACM, whose dependency DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED needs a
# zephyr,cdc-acm-uart devicetree node. Only the snippet supplies that node, and
# Zephyr turns the unmet dependency into a build error.
#
# Read the log with:
#   macOS:  ls /dev/tty.usbmodem*     then    screen /dev/tty.usbmodemXXXX 115200
#   quit screen with  Ctrl-A  then  K  then  Y
#
# Press a key and look for these lines:
#   <dbg> kscan_gpio_matrix: Sending event at 2,3 state on
#   <dbg> zmk: Row: 2, col: 3, position: 24, pressed: true
#
# The first line comes from the matrix driver and appears on BOTH halves.
# The second comes from the central only, so the right half shows only the first.
#
#   lines appear but nothing types  -> the matrix is fine, the keymap or the
#                                      matrix transform is wrong
#   no line for one key            -> that switch or its solder joint is bad
#   no line for any key            -> the row or column pins are wrong

