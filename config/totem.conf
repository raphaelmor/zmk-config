# TOTEM — Colemak + Hands Down Promethium
#
# Ported from the QMK userspace at ~/code/perso/keyboard/qmk_userspace.
# See config/totem.keymap for the layout itself and the recovery notes.

# Mouse keys, for the MOUSE layer (&mmv / &msc / &mkp).
#
# This is the only symbol needed. Everything else derives from it: the two mouse
# behaviours default to y once this is on, and ZMK_INPUT_LISTENER is Kconfig-gated
# to the split central, so this file is shared by both halves safely.
#
# Speed and acceleration are tuned in the keymap, not here — see the &mmv block in
# config/ramo/ramo_config.dtsi and the ZMK_POINTING_DEFAULT_MOVE_VAL define at the
# top of config/totem.keymap.
CONFIG_ZMK_POINTING=y

# Deep sleep after 30 minutes rather than the 15-minute default.
#
# This is a workaround for a real constraint, not a battery preference. ZMK cannot
# boot into a non-zero layer: the default layer is permanently 0 (app/src/keymap.c:27)
# and layer state is a plain static with no settings handler, so it does not survive
# a reboot or a deep-sleep wake. Colemak holds layer 0, so every wake drops the board
# back to Colemak and Hands Down has to be re-selected. Waking less often means doing
# that less often.
#
# Set CONFIG_ZMK_SLEEP=n to remove the problem entirely, at the cost of battery life.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Adaptive keys (urob/zmk-adaptive-key), for the Hands Down Promethium rules and
# CommaMagic. See config/layouts/hdp-adapt.dtsi.
#
# LOWER than the default of 32, not higher. This sizes a fixed trigger_keys[]
# array inside EVERY trigger child node, so it caps the length of one
# trigger-keys list rather than the number of rules. The longest list here is 2
# (<G V> on ak_M, where GM and VM both produce L). At 32, roughly 50 trigger
# nodes each carry a 32-entry dead array — order 12-16 KB of wasted flash.
# 4 rather than 2 leaves headroom for a rule that merges a few more triggers.
CONFIG_ZMK_ADAPTIVE_KEY_MAX_TRIGGER_CONDITIONS=4

# Longest binding sequence in a single rule is 3 (&kp BSPC &kp L &kp G), so the
# default of 4 already fits. Stated so a longer rule added later gets a warning
# here rather than a silent truncation.
CONFIG_ZMK_ADAPTIVE_KEY_MAX_BINDINGS=4

# USB serial logging is NOT enabled. It was needed for the matrix validation build
# and came from the "zmk-usb-logging" snippet in build.yaml, which has been removed:
# logging keeps USB awake and costs battery.
#
# To bring it back for debugging, re-add the snippet lines to build.yaml. Setting
# CONFIG_ZMK_USB_LOGGING=y here cannot work on its own — the symbol selects
# USB_CDC_ACM, whose DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED dependency needs a
# zephyr,cdc-acm-uart devicetree node that only the snippet supplies.
#
# Read the log with:
#   ls /dev/tty.usbmodem*    then    screen /dev/tty.usbmodemXXXX 115200
#   quit screen with  Ctrl-A  then  K  then  Y

# ZMK Studio is not enabled. It would let you edit the keymap live, but most of
# this layout is custom behaviours that Studio cannot express, so the devicetree
# stays the source of truth.
# CONFIG_ZMK_STUDIO=y
