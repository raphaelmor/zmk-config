manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-keyboard-totem
      url: https://github.com/raphaelmor/zmk-keyboard-totem
      # Pinned, not floating on main: this is your own fork, so an unrelated push
      # to it would silently change what CI builds here.
      revision: 579eb46
      path: modules/zmk-keyboard-totem
  self:
    path: config
