# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
# The two daily-driver builds, plus a settings_reset build and two logging builds.
#
# The logging builds cost CI time and nothing else — they are separate artifacts, so
# the daily-driver firmware stays clean. Keep them; this board has no other
# diagnostic channel.
include:
  - board: seeeduino_xiao_ble
    shield: totem_left
  - board: seeeduino_xiao_ble
    shield: totem_right

  # ---- RECOVERY -------------------------------------------------------------
  #
  # settings_reset wipes the settings partition — Bluetooth bonds, both to the host
  # and between the halves, plus the saved USB/BLE endpoint preference. ZMK ships
  # the shield; this repo did not build it until pairing broke and there was no
  # known-correct one for this board.
  #
  # THIS IS NOT OPTIONAL READING. A wipe that does not complete is silent, and it
  # looks exactly like a hardware fault: the Mac shows TOTEM under Nearby, Connect
  # spins, and the log says CBATTErrorInsufficientEncryption on the Report Map
  # characteristic. That is the keyboard refusing to bond because the profile is
  # still occupied. The right half also stops sending keys, because the split bond
  # is stale on one side only.
  #
  # PROCEDURE, per half, and the wait is the part that matters:
  #   1. Double-tap reset. Drag the settings_reset uf2.
  #   2. WAIT ~10 seconds. It boots and wipes. Do not double-tap during this.
  #   3. Confirm it actually ran: plug that half in over USB and check for a device
  #      named "SETTINGS RESET" —
  #        system_profiler SPUSBDataType | grep -A4 -i "settings reset"
  #      The shield sets ZMK_KEYBOARD_NAME to that, and Kconfig:13-14 feeds
  #      ZMK_KEYBOARD_NAME into USB_DEVICE_PRODUCT. It uses a mock kscan, so it
  #      enumerates but types nothing. If the name is absent, the wipe did not run.
  #   4. Double-tap reset. Drag the real uf2 for that half.
  # Do BOTH halves. A half-reset pair leaves one side authenticating against a bond
  # the other no longer has.
  #
  # Then: both halves off, Bluetooth off on the host, right half on, wait 5s, left
  # half on, wait 5s, Bluetooth on, pair. No USB attached to either half while
  # pairing — after a wipe there is no saved endpoint preference, and
  # src/endpoints.c:30-31 defaults it to USB, so an attached cable routes HID away
  # from the BLE link you are trying to establish.
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset

  # ---- LOGGING --------------------------------------------------------------
  #
  # The zmk-usb-logging snippet is the only way to get USB serial logging in v0.3 —
  # see config/totem.conf for why CONFIG_ZMK_USB_LOGGING alone cannot work.
  # CONFIG_ZMK_LOG_LEVEL_DBG raises the level enough to see BLE connection, bonding
  # and endpoint-selection events.
  #
  # Read it with:
  #   ls /dev/tty.usbmodem*   then   screen /dev/tty.usbmodemXXXX 115200
  #   quit screen with  Ctrl-A  then  K  then  Y
  #
  # On the LEFT half, look for:
  #   "Selected endpoint transport 0"   -> USB won; BLE will look connected but dead
  #   "Only BLE is ready"               -> what you want when on battery
  #   peer/bond/security failures       -> a stale bond survived the reset
  - board: seeeduino_xiao_ble
    shield: totem_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: totem_left_logging
  - board: seeeduino_xiao_ble
    shield: totem_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: totem_right_logging
